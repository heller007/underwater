model: yolov8n.pt
imgsz: 640
epochs: 100
patience: 20
batch: 32  # dual T4: ~16 per GPU; reduce to 16 or 8 if OOM
optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 3
cos_lr: true
amp: true
# Geometric aug on; color aug off (enhancement is the IV)
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
close_mosaic: 10
workers: 2
seed: 0
pretrained: true
# Checkpoint selection metric
save_period: -1
exist_ok: true
project: runs
name: detector_raw
